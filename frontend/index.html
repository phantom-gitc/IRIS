<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIS — Intelligent Real-time Interactive System</title>
    <meta name="description" content="IRIS is a realtime conversational computer agent with a warm, intelligent, confident personality." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('iris-ui-storage');
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed.state && parsed.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
              return;
            }
          }
          document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased overflow-hidden select-none m-0 p-0 h-full w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
